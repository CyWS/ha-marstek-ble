name: New Marstek product support
description: Request investigation of a Marstek product that is not currently supported.
title: "[Device support] "
body:
  - type: markdown
    attributes:
      value: |
        We are willing to investigate additional Marstek products where the BLE interface is accessible.
        A request does not guarantee support: different products may use different commands, packet layouts, or control semantics, and we will not assume compatibility from shared command numbers alone.

  - type: input
    id: product
    attributes:
      label: Product name
      description: Enter the exact commercial model name if possible.
      placeholder: "Marstek ..."
    validations:
      required: true

  - type: input
    id: ble_name
    attributes:
      label: BLE advertising name or prefix
      description: Provide the advertised Bluetooth name/prefix if known.
      placeholder: "MST_..."
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware revision / configuration
      description: Include installed batteries, expansions, inverter variant, or other configuration details where relevant.

  - type: input
    id: firmware
    attributes:
      label: Firmware versions
      description: Include any EMS, inverter, MPPT, BMS, or application-reported firmware versions you can find.

  - type: textarea
    id: capabilities
    attributes:
      label: What should be supported?
      description: Describe the telemetry and controls the product exposes in the Marstek app or otherwise.
      placeholder: "Battery telemetry, PV inputs, inverter output, schedules, ..."
    validations:
      required: true

  - type: textarea
    id: access
    attributes:
      label: Available test access
      description: |
        Tell us whether you own the device and can install development builds, provide repeated diagnostics/logs, and perform controlled tests when requested.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / BLE information
      description: |
        Attach any Home Assistant Marstek BLE diagnostics you can obtain, relevant logs, or other BLE observations.
        Unsupported devices may not yet produce a normal config-entry diagnostics file, so this field is optional.
        Review any diagnostic or capture material before posting it publicly if it contains information you consider sensitive.

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add product links, manuals, screenshots, app behavior, or related open-source protocol work.
